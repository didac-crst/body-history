<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Body History">
  <defs>
    <radialGradient id="g1" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#d9e8ef"/>
      <stop offset="100%" stop-color="#e7edf2"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#efe2cf"/>
      <stop offset="100%" stop-color="#efe2cf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#g1)"/>
  <rect width="180" height="180" rx="40" fill="url(#g2)"/>
  <!-- platform -->
  <rect x="34" y="128" width="112" height="24" rx="12" fill="#0f6a5a"/>
  <ellipse cx="90" cy="130" rx="50" ry="12" fill="#0a4e42"/>
  <ellipse cx="90" cy="130" rx="44" ry="8" fill="#0f6a5a"/>
  <!-- stem -->
  <rect x="84" y="62" width="12" height="68" rx="6" fill="#0a4e42"/>
  <!-- dial -->
  <circle cx="90" cy="66" r="38" fill="#fffcf7"/>
  <circle cx="90" cy="66" r="38" fill="none" stroke="#0f6a5a" stroke-width="4"/>
  <circle cx="90" cy="66" r="28" fill="none" stroke="#c9d2da" stroke-width="2"/>
  <!-- ticks -->
  <g stroke="#1c242b" stroke-width="2" stroke-linecap="round">
    <line x1="90" y1="44" x2="90" y2="38"/>
    <line x1="68.5" y1="52.5" x2="64.5" y2="48"/>
    <line x1="111.5" y1="52.5" x2="115.5" y2="48"/>
    <line x1="74" y1="78" x2="69" y2="82"/>
    <line x1="106" y1="78" x2="111" y2="82"/>
  </g>
  <!-- needle -->
  <line x1="90" y1="66" x2="106" y2="48" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
  <circle cx="90" cy="66" r="5" fill="#0f6a5a"/>
</svg>
